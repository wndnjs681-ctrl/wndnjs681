<meta charset="utf-8">
<title>스크리너 차트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 도구줄 한 줄 + [차트 캔버스 | 관심종목·종목정보 사이드바], 폰에서는 사이드바가 아래로 */
:root {
  --bg: #f6f7f8;          /* 화면 바탕 — 살짝 푸른 회색 */
  --panel: #ffffff;       /* 차트·사이드바 면 */
  --line: #e2e5e9;        /* 구분선 */
  --grid: #eef0f3;        /* 차트 격자 */
  --ink: #15191e;         /* 본문 글자 */
  --ink-2: #5a636e;       /* 보조 글자 */
  --ink-3: #8a929c;       /* 축 눈금 */
  --accent: #1f2a37;      /* 선택된 컨트롤 */
  --accent-ink: #ffffff;
  --up: #d6343b;          /* 상승 = 빨강 (국내 관례) */
  --down: #2563c9;        /* 하락 = 파랑 */
  --flat: #8a929c;
  --ma5: #eb6834; --ma20: #6250d6; --ma60: #1baf7a; --ma120: #eda100;
  --band: rgba(90, 99, 110, .10);
  --vol: rgba(90, 99, 110, .22);
  --cross: #5a636e;
  --tag: #1f2a37; --tag-ink: #ffffff;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #151a20; --line: #262d36; --grid: #1c222a;
    --ink: #e6eaef; --ink-2: #a3acb7; --ink-3: #6f7984;
    --accent: #e6eaef; --accent-ink: #11151a;
    --up: #f0565c; --down: #4c8df0; --flat: #6f7984;
    --ma5: #d95926; --ma20: #9085e9; --ma60: #199e70; --ma120: #c98500;
    --band: rgba(163, 172, 183, .10); --vol: rgba(163, 172, 183, .20);
    --cross: #a3acb7; --tag: #e6eaef; --tag-ink: #11151a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #151a20; --line: #262d36; --grid: #1c222a;
  --ink: #e6eaef; --ink-2: #a3acb7; --ink-3: #6f7984;
  --accent: #e6eaef; --accent-ink: #11151a;
  --up: #f0565c; --down: #4c8df0; --flat: #6f7984;
  --ma5: #d95926; --ma20: #9085e9; --ma60: #199e70; --ma120: #c98500;
  --band: rgba(163, 172, 183, .10); --vol: rgba(163, 172, 183, .20);
  --cross: #a3acb7; --tag: #e6eaef; --tag-ink: #11151a;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
}
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; min-height: 560px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ── 도구줄 ── */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.search { position: relative; flex: 1 1 240px; max-width: 360px; min-width: 0; }
.search input {
  width: 100%; box-sizing: border-box; height: 36px; padding: 0 12px 0 34px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: var(--ink);
  font: inherit;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 8px; top: 8px; font: 12px var(--font-num); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.results {
  position: absolute; z-index: 20; top: 40px; left: 0; right: 0; max-height: 340px; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px;
}
.results button {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left;
  padding: 7px 10px; border: 0; background: none; color: var(--ink); border-radius: 4px; font: inherit; cursor: pointer;
}
.results button[aria-selected="true"], .results button:hover { background: var(--bg); }
.results .t { font: 12px var(--font-num); color: var(--ink-2); }
.results .m { font-size: 12px; color: var(--ink-3); grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.results .empty { padding: 10px; color: var(--ink-2); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 2px; gap: 2px; }
.seg button, .chip {
  font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-2);
  padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .chip:focus-visible, .wl button:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); }
.chip i { width: 12px; height: 2px; border-radius: 1px; background: var(--ink-3); display: inline-block; }
.chip[aria-pressed="false"] i { opacity: .35; }
.tlabel { font-size: 11px; letter-spacing: .06em; color: var(--ink-3); margin-right: -6px; }

/* ── 본문 ── */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 10px; }
.chart-wrap {
  position: relative; min-width: 0; min-height: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
}
.plot { position: absolute; inset: 0; touch-action: none; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { cursor: crosshair; }
#overlay.dragging { cursor: grabbing; }
.legend {
  position: absolute; left: 12px; top: 10px; right: 76px; pointer-events: none;
  display: flex; flex-direction: column; gap: 3px; font-size: 12px;
}
.legend .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.legend .name { font-size: 15px; font-weight: 600; color: var(--ink); }
.legend .meta { color: var(--ink-2); }
.legend .ohlc { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--ink-2); }
.legend .ohlc b { font-weight: 500; color: var(--ink); }
.legend .mas { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--ink-2); }
.legend .mas span::before { content: ""; display: inline-block; width: 10px; height: 2px; margin-right: 5px; vertical-align: middle; background: currentColor; border-radius: 1px; }
.legend .up { color: var(--up); } .legend .down { color: var(--down); }
.pane-label { position: absolute; left: 12px; font-size: 12px; color: var(--ink-2); pointer-events: none; display: flex; gap: 10px; }
.pane-label b { font-weight: 500; color: var(--ink); }
.status {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
  color: var(--ink-2); background: var(--panel); line-height: 1.6;
}
.status code { font-family: var(--font-num); background: var(--bg); padding: 2px 6px; border-radius: 4px; color: var(--ink); }
.zoom { position: absolute; right: 76px; bottom: 34px; display: flex; gap: 4px; }
.icon-btn {
  width: 28px; height: 28px; display: grid; place-items: center; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); font: 14px var(--font-num);
}
.icon-btn:hover { color: var(--ink); }

.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card h2 {
  margin: 0; padding: 10px 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--ink-2);
  border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
}
.card h2 button { font: inherit; font-size: 12px; letter-spacing: 0; border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.card h2 button:hover { color: var(--ink); }
.wl-card { flex: 1; min-height: 160px; display: flex; flex-direction: column; }
.wl { list-style: none; margin: 0; padding: 4px; overflow-y: auto; flex: 1; }
.wl li { display: flex; align-items: center; }
.wl button.pick {
  flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding: 7px 8px;
  border: 0; background: none; color: var(--ink); text-align: left; border-radius: 4px; cursor: pointer; font: inherit;
}
.wl button.pick:hover, .wl li.on button.pick { background: var(--bg); }
.wl .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.wl .p { text-align: right; }
.wl .t { font: 11px var(--font-num); color: var(--ink-3); }
.wl .c { font-size: 12px; text-align: right; }
.wl button.del { border: 0; background: none; color: var(--ink-3); cursor: pointer; width: 24px; height: 24px; border-radius: 4px; font-size: 15px; }
.wl button.del:hover { color: var(--ink); background: var(--bg); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.info dl { margin: 0; padding: 8px 12px 12px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.info dt { color: var(--ink-2); }
.info dd { margin: 0; text-align: right; }
.info .sector { padding: 10px 12px 0; color: var(--ink-2); font-size: 12px; }
.range { padding: 0 12px 12px; }
.range .bar { position: relative; height: 4px; border-radius: 2px; background: var(--grid); margin: 6px 0 4px; }
.range .dot { position: absolute; top: -4px; width: 4px; height: 12px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.range .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
.foot { font-size: 11px; color: var(--ink-3); line-height: 1.5; padding: 0 2px; }

@media (max-width: 860px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .chart-wrap { height: 460px; }
  .wl-card { max-height: 360px; }
  .legend { right: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <div class="toolbar" role="toolbar" aria-label="차트 설정">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" placeholder="종목명·코드 검색 (삼성전자, 005930, NVDA)" aria-label="종목 검색" aria-controls="results">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
    <span class="tlabel">주기</span>
    <div class="seg" id="intervals">
      <button type="button" data-v="D" aria-pressed="true">일</button>
      <button type="button" data-v="W" aria-pressed="false">주</button>
      <button type="button" data-v="M" aria-pressed="false">월</button>
    </div>
    <div class="seg" id="styles">
      <button type="button" data-v="candle" aria-pressed="true">캔들</button>
      <button type="button" data-v="line" aria-pressed="false">라인</button>
    </div>
    <span class="tlabel">지표</span>
    <div class="chips" id="studies">
      <button type="button" class="chip" data-k="ma5" aria-pressed="true"><i style="background:var(--ma5)"></i>MA5</button>
      <button type="button" class="chip" data-k="ma20" aria-pressed="true"><i style="background:var(--ma20)"></i>MA20</button>
      <button type="button" class="chip" data-k="ma60" aria-pressed="true"><i style="background:var(--ma60)"></i>MA60</button>
      <button type="button" class="chip" data-k="ma120" aria-pressed="false"><i style="background:var(--ma120)"></i>MA120</button>
      <button type="button" class="chip" data-k="bb" aria-pressed="false"><i></i>볼린저</button>
      <button type="button" class="chip" data-k="vol" aria-pressed="true"><i></i>거래량</button>
      <button type="button" class="chip" data-k="rsi" aria-pressed="true"><i></i>RSI</button>
      <button type="button" class="chip" data-k="macd" aria-pressed="false"><i></i>MACD</button>
    </div>
  </div>

  <div class="main">
    <div class="chart-wrap" id="wrap">
      <div class="plot" id="plot">
        <canvas id="base" aria-hidden="true"></canvas>
        <canvas id="overlay" role="img" aria-label="가격 차트"></canvas>
      </div>
      <div class="legend" id="legend" aria-live="polite"></div>
      <div id="paneLabels"></div>
      <div class="zoom">
        <button type="button" class="icon-btn" id="zoomOut" aria-label="축소">−</button>
        <button type="button" class="icon-btn" id="zoomIn" aria-label="확대">+</button>
        <button type="button" class="icon-btn" id="zoomReset" aria-label="처음 화면으로" title="처음 화면으로 (더블클릭)">↺</button>
      </div>
      <div class="status" id="status">데이터를 불러오는 중…</div>
    </div>

    <aside class="side">
      <section class="card wl-card" aria-labelledby="wlTitle">
        <h2><span id="wlTitle">관심종목</span><button type="button" id="wlAdd">+ 현재 종목 추가</button></h2>
        <ul class="wl" id="wl"></ul>
      </section>
      <section class="card info" aria-labelledby="infoTitle">
        <h2><span id="infoTitle">종목 정보</span><span class="num" id="asof"></span></h2>
        <div id="info"></div>
      </section>
      <p class="foot">드래그로 이동, 휠·핀치로 확대, 더블클릭으로 처음 화면. 키보드: <span class="num">← →</span> 이동, <span class="num">+ −</span> 확대, <span class="num">/</span> 검색. 캔들은 최근 150거래일, 그 이전은 종가 선으로 표시됩니다.</p>
    </aside>
  </div>
</div>

<script>
"use strict";
// ── 설정 ──────────────────────────────────────────────────────
const DATA = "output/";
const STORE = "screener-chart:v1";
const DEFAULT_WL = ["kr:005930", "kr:000660", "kr:373220", "us:NVDA", "us:AAPL", "ix:KS11", "ix:IXIC"];
const MA_KEYS = [["ma5", 5], ["ma20", 20], ["ma60", 60], ["ma120", 120]];
const MK_LABEL = { kr: "국내", us: "미국", ix: "지수" };

// ── 저장 (실패해도 동작) ─────────────────────────────────────
function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ sym: state.id, interval: state.interval, style: state.style, studies: state.studies, wl: state.wl }));
  } catch { /* 저장소 차단 — 무시 */ }
}
const saved = load();
const state = {
  id: saved.sym || "kr:005930",
  interval: saved.interval || "D",
  style: saved.style || "candle",
  studies: Object.assign({ ma5: true, ma20: true, ma60: true, ma120: false, bb: false, vol: true, rsi: true, macd: false }, saved.studies || {}),
  wl: Array.isArray(saved.wl) && saved.wl.length ? saved.wl : DEFAULT_WL.slice(),
  bars: [], ind: {}, end: 0, count: 120, hover: null,
};

// ── 데이터 ────────────────────────────────────────────────────
const db = { kr: null, us: null, ix: null, names: [], meta: {}, loading: {} };

async function getJSON(path) {
  const r = await fetch(DATA + path, { cache: "no-cache" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function loadMarket(mk) {
  if (db.loading[mk]) return db.loading[mk];
  db.loading[mk] = (async () => {
    if (mk === "ix") {
      const j = await getJSON("market_index.json");
      db.ix = { asof: j.asof, s: j.idx };
      for (const [t, v] of Object.entries(j.idx)) db.names.push({ id: "ix:" + t, mk, t, name: v.name, sector: "지수" });
    } else {
      const [series, uni] = await Promise.all([getJSON(`series_${mk}.json`), getJSON(`universe_${mk}.json`)]);
      const rows = {};
      for (const r of uni.rows) rows[r.ticker] = r;
      db[mk] = { dates: series.dates, s: series.s, rows, asof: uni.date, schema: uni.schema };
      for (const t of Object.keys(series.s)) {
        const r = rows[t] || {};
        db.names.push({ id: mk + ":" + t, mk, t, name: r.name || t, sector: r.sector || "", mcap: r.mcap || 0 });
      }
    }
    db.names.sort((a, b) => (b.mcap || 0) - (a.mcap || 0));
    renderWatchlist();
  })();
  return db.loading[mk];
}

// yymmdd → Date(UTC)
const ymd = s => s.length === 6 ? Date.UTC(2000 + +s.slice(0, 2), +s.slice(2, 4) - 1, +s.slice(4, 6)) : Date.parse(s + "T00:00:00Z");

// 종목 → 일봉 배열 {t,o,h,l,c,v,ohlc}
function dailyBars(id) {
  const [mk, t] = id.split(":");
  if (mk === "ix") {
    const v = db.ix && db.ix.s[t]; if (!v) return null;
    return v.d.map((d, i) => ({ t: ymd(d), o: v.c[i], h: v.c[i], l: v.c[i], c: v.c[i], v: v.v ? v.v[i] : 0, ohlc: false }));
  }
  const m = db[mk]; const rec = m && m.s[t]; if (!rec) return null;
  const c = rec.c.split(",").map(Number), v = rec.v.split(",").map(Number);
  const k = rec.k || 0, n = c.length, dates = m.dates.slice(-n);
  const o = rec.o ? rec.o.split(",").map(Number) : [], h = rec.h ? rec.h.split(",").map(Number) : [], l = rec.l ? rec.l.split(",").map(Number) : [];
  const out = [];
  for (let i = 0; i < n; i++) {
    const j = i - (n - k); // OHLC 는 마지막 k 개만, 종가와의 차이로 저장돼 있다
    if (j >= 0) {
      const oo = c[i] + o[j], hh = c[i] + h[j], ll = c[i] + l[j];
      out.push({ t: ymd(dates[i]), o: oo, h: Math.max(hh, oo, c[i]), l: Math.min(ll, oo, c[i]), c: c[i], v: v[i] * 1000, ohlc: true });
    } else out.push({ t: ymd(dates[i]), o: c[i], h: c[i], l: c[i], c: c[i], v: v[i] * 1000, ohlc: false });
  }
  return out;
}

// 주·월봉으로 묶기
function resample(bars, iv) {
  if (iv === "D") return bars;
  const key = t => {
    const d = new Date(t);
    if (iv === "M") return d.getUTCFullYear() * 12 + d.getUTCMonth();
    const day = (d.getUTCDay() + 6) % 7; return t - day * 864e5; // 그 주 월요일
  };
  const out = []; let cur = null, ck = null;
  for (const b of bars) {
    const k = key(b.t);
    if (k !== ck) { if (cur) out.push(cur); cur = { ...b }; ck = k; }
    else { cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l); cur.c = b.c; cur.v += b.v; cur.t2 = b.t; cur.ohlc = cur.ohlc && b.ohlc; }
  }
  if (cur) out.push(cur);
  return out;
}

// ── 지표 (브라우저에서 계산) ─────────────────────────────────
function sma(x, n) { const o = new Array(x.length).fill(null); let s = 0; for (let i = 0; i < x.length; i++) { s += x[i]; if (i >= n) s -= x[i - n]; if (i >= n - 1) o[i] = s / n; } return o; }
function ema(x, n) { const o = new Array(x.length).fill(null); const a = 2 / (n + 1); let e = null; for (let i = 0; i < x.length; i++) { if (x[i] == null) continue; e = e == null ? x[i] : x[i] * a + e * (1 - a); if (i >= n - 1) o[i] = e; } return o; }
function rsi(c, n = 14) {
  const o = new Array(c.length).fill(null); let g = 0, l = 0;
  for (let i = 1; i < c.length; i++) {

  const box = document.getElementById("paneLabels"); box.replaceChildren();
  for (const p of L.panes.slice(1)) {
    const d = el("div", { class: "pane-label num", id: "pl-" + p.id, style: `top:${p.y + 5}px` });
    if (p.id === "rsi") d.append(el("span", null, "RSI 14"), el("b", null, "—"));
    else d.append(el("span", null, "MACD 12 26 9"), el("b", { style: "color:var(--ma5)" }, "—"), el("b", { style: "color:var(--ma20)" }, "—"));
    box.append(d);
  }
}

// ── 종목 정보 ────────────────────────────────────────────────
function renderInfo() {
  const box = document.getElementById("info"), [mk, t] = state.id.split(":"), B = state.bars;
  document.getElementById("asof").textContent = mk === "ix" ? (db.ix ? db.ix.asof.slice(0, 10) : "") : (db[mk] ? db[mk].asof : "");
  const kids = [];
  if (mk === "ix") {
    const cs = B.map(b => b.c), hi = Math.max(...cs.slice(-252)), lo = Math.min(...cs.slice(-252)), last = cs[cs.length - 1];
    kids.push(el("p", { class: "sector" }, "시장 지수 · 종가 기준"));
    kids.push(dl([["현재", fmtPrice(last)], ["전일 대비", fmtPct((last / cs[cs.length - 2] - 1) * 100), cls(last - cs[cs.length - 2])], ["1년 수익률", fmtPct((last / cs[Math.max(0, cs.length - 252)] - 1) * 100)]]));
    kids.push(range(lo, hi, last));
  } else {
    const r = db[mk].rows[t] || {};
    const money = mk === "kr"
      ? v => v == null ? "—" : v >= 1e4 ? (v / 1e4).toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "조" : Math.round(v).toLocaleString("ko-KR") + "억"
      : v => v == null ? "—" : v >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "T" : v >= 1e3 ? "$" + (v / 1e3).toFixed(1) + "B" : "$" + Math.round(v) + "M";
    const f1 = (v, u = "") => v == null || !isFinite(v) ? "—" : v.toFixed(1) + u;
    kids.push(el("p", { class: "sector" }, r.sector || ""));
    kids.push(dl([
      ["시가총액", money(r.mcap)], ["거래대금", money(r.value)],
      ["PER", f1(r.per, "배")], ["PBR", f1(r.pbr, "배")], ["ROE", f1(r.roe, "%")], ["배당수익률", f1(r.dvd_yld, "%")],
      ["20일 수익률", fmtPct(r.ret20), cls(r.ret20)], ["60일 수익률", fmtPct(r.ret60), cls(r.ret60)],
    ]));
    if (r.hi252 && r.lo252) kids.push(range(r.lo252, r.hi252, r.price));
  }
  box.replaceChildren(...kids);
}
function dl(rows) {
  const d = el("dl", { class: "num" });
  for (const [k, v, c] of rows) d.append(el("dt", null, k), el("dd", c ? { class: c } : null, v));
  return d;
}
function range(lo, hi, cur) {
  const pct = Math.max(0, Math.min(100, (cur - lo) / (hi - lo) * 100));
  return el("div", { class: "range" },
    el("div", { style: "font-size:12px;color:var(--ink-2)" }, `52주 범위 · 현재 ${pct.toFixed(0)}% 위치`),
    el("div", { class: "bar" }, el("span", { class: "dot", style: `left:${pct}%` })),
    el("div", { class: "ends num" }, el("span", null, fmtPrice(lo)), el("span", null, fmtPrice(hi))));
}

// ── 관심종목 ─────────────────────────────────────────────────
function quickQuote(id) {
  const b = dailyBars(id); if (!b || b.length < 2) return null;
  const l = b[b.length - 1].c, p = b[b.length - 2].c; return { l, chg: (l / p - 1) * 100 };
}
function renderWatchlist() {
  const ul = document.getElementById("wl"); ul.replaceChildren();
  for (const id of state.wl) {
    const [mk, t] = id.split(":"), ready = mk === "ix" ? !!db.ix : !!db[mk], q = ready ? quickQuote(id) : null;
    const pick = el("button", { type: "button", class: "pick" },
      el("span", { class: "n" }, ready ? nameOf(id) : t),
      el("span", { class: "p num" }, q ? fmtPrice(q.l, id) : "…"),
      el("span", { class: "t" }, `${t} · ${MK_LABEL[mk]}`),
      el("span", { class: "c num " + (q ? cls(q.chg) : "flat") }, q ? fmtPct(q.chg) : ""));
    pick.addEventListener("click", () => setSymbol(id));
    const del = el("button", { type: "button", class: "del", "aria-label": `${t} 관심종목에서 빼기`, title: "빼기" }, "×");
    del.addEventListener("click", () => { state.wl = state.wl.filter(x => x !== id); save(); renderWatchlist(); });
    const li = el("li", id === state.id ? { class: "on" } : null, pick, del);
    ul.append(li);
  }
  if (!state.wl.length) ul.append(el("li", { style: "padding:12px;color:var(--ink-2);font-size:13px" }, "검색한 종목을 ‘+ 현재 종목 추가’로 담아두세요."));
  const add = document.getElementById("wlAdd"), has = state.wl.includes(state.id);
  add.textContent = has ? "담겨 있음" : "+ 현재 종목 추가"; add.disabled = has;
}
document.getElementById("wlAdd").addEventListener("click", () => { if (!state.wl.includes(state.id)) { state.wl.push(state.id); save(); renderWatchlist(); } });

// ── 종목 바꾸기 / 주기 바꾸기 ────────────────────────────────
async function setSymbol(id) {
  const mk = mkOf(id), status = document.getElementById("status");
  try { await loadMarket(mk); } catch (e) { showLoadError(e); return; }
  const daily = dailyBars(id);
  if (!daily) { status.hidden = false; status.textContent = `${id.split(":")[1]} 데이터가 없습니다. 다른 종목을 검색해 보세요.`; return; }
  state.id = id; state.daily = daily; status.hidden = true;
  applyInterval(true); renderInfo(); renderWatchlist(); save();
}
function applyInterval(reset) {
  state.bars = resample(state.daily, state.interval);
  computeIndicators(); state.hover = null;
  if (reset) resetView(); else { state.end = state.bars.length - 1 + 3; state.count = Math.min(state.count, state.bars.length + 4); clampView(); }
  draw();
}
function bindSeg(id, key, after) {
  const box = document.getElementById(id);
  const sync = () => box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === state[key])));
  box.addEventListener("click", e => { const b = e.target.closest("button"); if (!b || state[key] === b.dataset.v) return; state[key] = b.dataset.v; sync(); save(); after(); });
  sync();
}
bindSeg("intervals", "interval", () => { if (state.daily) { applyInterval(true); } });
bindSeg("styles", "style", draw);
const studyBox = document.getElementById("studies");
studyBox.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(!!state.studies[c.dataset.k])));
studyBox.addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const k = c.dataset.k; state.studies[k] = !state.studies[k]; c.setAttribute("aria-pressed", String(state.studies[k])); save(); draw();
});

// ── 검색 ─────────────────────────────────────────────────────
const q = document.getElementById("q"), results = document.getElementById("results");
let hits = [], sel = 0;
function search(text) {
  const s = text.trim().toLowerCase(); if (!s) return [];
  const exact = [], starts = [], has = [];
  for (const n of db.names) {
    const t = n.t.toLowerCase(), nm = n.name.toLowerCase();
    if (t === s || nm === s) exact.push(n); else if (t.startsWith(s) || nm.startsWith(s)) starts.push(n); else if (nm.includes(s) || t.includes(s)) has.push(n);
  }
  return exact.concat(starts, has).slice(0, 30);
}
function renderResults() {
  results.replaceChildren();
  if (!q.value.trim()) { results.hidden = true; return; }
  if (!hits.length) results.append(el("div", { class: "empty" }, "일치하는 종목이 없습니다."));
  hits.forEach((n, i) => {
    const b = el("button", { type: "button", role: "option", "aria-selected": String(i === sel) },
      el("span", null, n.name), el("span", { class: "m" }, MK_LABEL[n.mk]), el("span", { class: "t" }, n.t + (n.sector ? " · " + n.sector : "")));
    b.addEventListener("mousedown", e => { e.preventDefault(); choose(n); });
    results.append(b);
  });
  results.hidden = false;
  const s = results.children[sel]; if (s && s.scrollIntoView) s.scrollIntoView({ block: "nearest" });
}
function choose(n) { q.value = ""; results.hidden = true; q.blur(); setSymbol(n.id); }
q.addEventListener("input", () => { hits = search(q.value); sel = 0; renderResults(); });
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sel = Math.min(hits.length - 1, sel + 1); renderResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); renderResults(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[sel]) choose(hits[sel]);
  else if (e.key === "Escape") { q.value = ""; results.hidden = true; q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => results.hidden = true, 120));

// ── 마우스·터치·키보드 ───────────────────────────────────────
const pointers = new Map(); let drag = null, pinch = null;
function idxAt(x) { const V = view(); return Math.round(state.end - (V.plotW - x) / V.bw + 0.5); }
function setHover(x, y) {
  if (!state.bars.length) return;
  const i = Math.max(0, Math.min(state.bars.length - 1, idxAt(x)));
  state.hover = { i, y }; drawOverlay(); updateLegend();
}
overC.addEventListener("pointerdown", e => {
  overC.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (pointers.size === 1) { drag = { x: e.offsetX, end: state.end }; overC.classList.add("dragging"); }
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.abs(a.x - b.x) || 1, count: state.count }; drag = null; }
});
overC.addEventListener("pointermove", e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; state.count = pinch.count * pinch.d / (Math.abs(a.x - b.x) || 1); clampView(); draw(); return; }
  if (drag) { const V = view(); state.end = drag.end - (e.offsetX - drag.x) / V.bw; clampView(); draw(); }
  if (e.pointerType === "mouse" || drag) setHover(e.offsetX, e.offsetY);
});
function endPointer(e) { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) { drag = null; overC.classList.remove("dragging"); } }
overC.addEventListener("pointerup", endPointer); overC.addEventListener("pointercancel", endPointer);
overC.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !drag) { state.hover = null; drawOverlay(); updateLegend(); } });
overC.addEventListener("wheel", e => {
  e.preventDefault(); const V = view();
  const anchor = state.end - (V.plotW - e.offsetX) / V.bw, k = Math.exp(e.deltaY * 0.0015);
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { state.end += e.deltaX / V.bw; }
  else { const nc = state.count * k; state.end = anchor + (state.end - anchor) * nc / state.count; state.count = nc; }
  clampView(); draw(); setHover(e.offsetX, e.offsetY);
}, { passive: false });
overC.addEventListener("dblclick", () => { resetView(); draw(); });
function zoomBy(k) { const anchor = state.end; state.count *= k; state.end = anchor; clampView(); draw(); }
document.getElementById("zoomIn").addEventListener("click", () => zoomBy(0.8));
document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1.25));
document.getElementById("zoomReset").addEventListener("click", () => { resetView(); draw(); });
document.addEventListener("keydown", e => {
  if (e.target === q) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); return; }
  if (e.target.closest && e.target.closest("input,textarea")) return;
  const step = Math.max(1, state.count * 0.1);
  if (e.key === "ArrowLeft") { state.end -= step; clampView(); draw(); }
  else if (e.key === "ArrowRight") { state.end += step; clampView(); draw(); }
  else if (e.key === "+" || e.key === "=") zoomBy(0.8);
  else if (e.key === "-") zoomBy(1.25);
});

// ── 테마·크기 변화 ───────────────────────────────────────────
new ResizeObserver(resize).observe(plot);
const mq = matchMedia("(prefers-color-scheme: dark)");
const retheme = () => { readColors(); draw(); };
mq.addEventListener ? mq.addEventListener("change", retheme) : mq.addListener(retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function showLoadError(e) {
  const s = document.getElementById("status"); s.hidden = false; s.replaceChildren(
    el("div", null,
      el("p", { style: "margin:0 0 8px;color:var(--ink);font-weight:600" }, "데이터 파일을 읽지 못했습니다"),
      el("p", { style: "margin:0" }, "레포 맨 위 폴더에서 ", el("code", null, "python3 -m http.server"), " 를 실행한 뒤"),
      el("p", { style: "margin:0" }, el("code", null, "http://localhost:8000/chart.html"), " 로 열어주세요."),
      el("p", { style: "margin:8px 0 0;font-size:12px;color:var(--ink-3)" }, String(e && e.message || e))));
}

// ── 시작 ─────────────────────────────────────────────────────
readColors();
(async () => {
  const first = mkOf(state.id);
  await setSymbol(state.id);
  for (const mk of ["kr", "us", "ix"]) if (mk !== first) loadMarket(mk).catch(() => {});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
