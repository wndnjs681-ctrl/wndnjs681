<meta charset="utf-8">
<title>스크리너 차트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 위 도구줄 / [그리기 도구 세로줄 | 차트 격자(1·2·4칸) | 사이드바 탭] — 폰에서는 세로로 쌓인다 */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --line: #e1e4e8; --grid: #eef0f3;
  --ink: #15191e; --ink-2: #59626d; --ink-3: #8a929c;
  --accent: #1f2a37; --accent-ink: #ffffff; --sel: #2a78d6;
  --up: #d6343b; --down: #2563c9; --flat: #8a929c;
  --cross: #59626d; --tag: #1f2a37; --tag-ink: #ffffff;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1115; --panel: #151a20; --line: #262d36; --grid: #1b2129;
    --ink: #e6eaef; --ink-2: #a3acb7; --ink-3: #6f7984;
    --accent: #e6eaef; --accent-ink: #11151a; --sel: #3987e5;
    --up: #f0565c; --down: #4c8df0; --flat: #6f7984;
    --cross: #a3acb7; --tag: #e6eaef; --tag-ink: #11151a;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1115; --panel: #151a20; --line: #262d36; --grid: #1b2129;
  --ink: #e6eaef; --ink-2: #a3acb7; --ink-3: #6f7984;
  --accent: #e6eaef; --accent-ink: #11151a; --sel: #3987e5;
  --up: #f0565c; --down: #4c8df0; --flat: #6f7984;
  --cross: #a3acb7; --tag: #e6eaef; --tag-ink: #11151a;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .small { font-size: 12px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.app { height: 100%; min-height: 600px; display: flex; flex-direction: column; gap: 8px; }

/* ── 위 도구줄 ── */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.tb-sym { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; min-width: 180px; max-width: 280px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: var(--ink); }
.tb-sym-name { flex: 1; text-align: left; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-sym svg { color: var(--ink-3); }
kbd { font: 11px var(--font-num); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 5px 9px; border-radius: 4px; font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .35; cursor: default; }
.seg.small button { padding: 3px 8px; font-size: 12px; }
.tb-select { height: 34px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 0 8px; font-size: 13px; }
.tb-btn { height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: var(--ink); font-size: 13px; white-space: nowrap; }
.tb-btn:hover, .tb-sym:hover { border-color: var(--ink-3); }
.tb-live { margin-left: auto; font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.tb-live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.tb-live.on::before { background: var(--c3); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c3) 25%, transparent); }
.tb-live.retry::before, .tb-live.poll::before { background: var(--c4); }
.tb-live.error::before { background: var(--c8); }

/* ── 본문 ── */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 44px minmax(0, 1fr) 300px; gap: 8px; }
.drawbar { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow-y: auto; }
.db-btn { width: 34px; height: 32px; flex: none; display: grid; place-items: center; border: 0; border-radius: 4px; background: none; color: var(--ink-2); }
.db-btn:hover { background: var(--bg); color: var(--ink); }
.db-btn[aria-pressed="true"] { background: color-mix(in srgb, var(--sel) 14%, transparent); color: var(--sel); }
.db-sep { width: 24px; height: 1px; background: var(--line); margin: 4px 0; flex: none; }

.grid { min-width: 0; min-height: 0; display: grid; gap: 6px; }
.grid.l1 { grid-template: 1fr / 1fr; }
.grid.l2h { grid-template: 1fr / 1fr 1fr; }
.grid.l2v { grid-template: 1fr 1fr / 1fr; }
.grid.l4 { grid-template: 1fr 1fr / 1fr 1fr; }
.cell { position: relative; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cell.active { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
.plot { position: absolute; inset: 0; touch-action: none; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.plot canvas.over { outline: none; }
.plot canvas.over.grabbing { cursor: grabbing !important; }

.legend { position: absolute; left: 8px; top: 6px; right: 80px; display: flex; flex-direction: column; gap: 1px; font-size: 12px; pointer-events: none; }
.lg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; pointer-events: auto; }
.lg-sym { border: 0; background: none; padding: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.lg-sym:hover { text-decoration: underline; }
.lg-meta { color: var(--ink-2); font-family: var(--font-num); }
.lg-ohlc { display: flex; flex-wrap: wrap; gap: 0 10px; color: var(--ink-2); }
.lg-ohlc b { font-weight: 500; }
.lg-date { color: var(--ink-3); }
.lg-row { display: flex; align-items: center; gap: 6px; width: fit-content; max-width: 100%; padding: 1px 4px; margin-left: -4px; border-radius: 4px; pointer-events: auto; }
.lg-row:hover { background: color-mix(in srgb, var(--panel) 80%, transparent); box-shadow: 0 0 0 1px var(--line); }
.lg-row.off .lg-name, .lg-row.off .lg-vals { opacity: .45; }
.lg-name { color: var(--ink-2); white-space: nowrap; }
.lg-vals { display: flex; gap: 8px; flex-wrap: wrap; }
.lg-vals b { font-weight: 500; }
.lg-acts { display: none; gap: 2px; }
.lg-row:hover .lg-acts, .lg-row:focus-within .lg-acts { display: inline-flex; }
.lg-btn { width: 20px; height: 20px; display: grid; place-items: center; border: 0; border-radius: 3px; background: none; color: var(--ink-2); padding: 0; }
.lg-btn:hover { background: var(--bg); color: var(--ink); }
.sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.lower-labels .lg-row { position: absolute; left: 8px; font-size: 12px; }
.pill { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--c1); color: #fff; }
.live-dot { font-size: 11px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
.live-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.live-dot.on::before { background: var(--c3); }
.auto-btn { position: absolute; right: 6px; bottom: 32px; width: 22px; height: 20px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink-3); font: 11px var(--font-num); padding: 0; }
.auto-btn.on { color: var(--sel); border-color: var(--sel); }
.status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--panel); color: var(--ink-2); line-height: 1.7; }
.status code { font-family: var(--font-num); background: var(--bg); padding: 2px 6px; border-radius: 4px; color: var(--ink); }
.st-title { color: var(--ink); font-weight: 600; margin: 0 0 6px; } .st-sub { font-size: 12px; color: var(--ink-3); }
.status p { margin: 0; }
.hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--tag); color: var(--tag-ink); padding: 8px 14px; border-radius: var(--r); font-size: 13px; pointer-events: none; }
.selbar, .replaybar {
  position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 6px; box-shadow: 0 6px 20px rgba(0,0,0,.12); max-width: calc(100% - 100px);
}
.selbar { top: 52px; } .replaybar { bottom: 34px; }
.sb-name { font-size: 12px; color: var(--ink-2); padding: 0 6px; white-space: nowrap; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }
.wbtn { width: 26px; height: 24px; border: 0; border-radius: 4px; background: none; display: grid; place-items: center; padding: 0; }
.wbtn i { width: 16px; background: var(--ink); border-radius: 2px; display: block; }
.wbtn.on { background: var(--bg); }
.sb-sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }
.sb-btn, .rb-btn { border: 0; background: none; border-radius: 4px; padding: 4px 8px; font-size: 12px; color: var(--ink); white-space: nowrap; }
.sb-btn:hover, .rb-btn:hover { background: var(--bg); }
.sb-btn.on { color: var(--sel); } .danger { color: var(--up) !important; }
.replaybar select { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); font-size: 12px; padding: 2px 4px; }
.rb-date { font-size: 12px; color: var(--ink-2); padding: 0 6px; }
.text-edit { position: absolute; z-index: 5; min-width: 160px; border: 1px solid var(--sel); border-radius: 4px; background: var(--panel); padding: 4px 6px; font-size: 13px; resize: both; }

/* ── 사이드바 ── */
.side { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 4px; font-size: 13px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.panel { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.wl-tools { display: flex; gap: 4px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.mini { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.mini:hover { color: var(--ink); border-color: var(--ink-3); }
.wl-add { border: 1px dashed var(--line); background: none; border-radius: var(--r); padding: 7px; font-size: 13px; color: var(--ink-2); }
.wl-add:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }
.wl-add:disabled { cursor: default; opacity: .6; }
.wl-head { display: grid; grid-template-columns: minmax(0, 1fr) 84px 64px 22px; font-size: 11px; color: var(--ink-3); padding: 0 6px; letter-spacing: .04em; }
.wl-head span:nth-child(n+2) { text-align: right; }
.wl, .alerts { list-style: none; margin: 0; padding: 0; }
.wl li, .alerts li { display: flex; align-items: center; border-radius: 4px; }
.wl li.on, .wl li:hover, .alerts li:hover { background: var(--bg); }
.wl-pick { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 84px 64px; gap: 0 4px; padding: 6px; border: 0; background: none; text-align: left; }
.wl-pick .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; display: flex; align-items: center; gap: 5px; }
.wl-pick .p, .wl-pick .c { text-align: right; } .wl-pick .c { font-size: 12px; }
.wl-pick .t { grid-column: 1 / -1; font: 11px var(--font-num); color: var(--ink-3); }
.live-mini { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
.live-mini.on { background: var(--c3); }
.del { width: 22px; height: 22px; border: 0; background: none; color: var(--ink-3); border-radius: 4px; font-size: 15px; flex: none; padding: 0; }
.del:hover { color: var(--ink); background: var(--line); }
li.empty, p.empty { color: var(--ink-2); font-size: 13px; padding: 10px; }
.conds { display: flex; flex-direction: column; gap: 4px; }
.cond { display: flex; gap: 4px; align-items: center; }
.cond select, .cond input { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); font-size: 12px; padding: 4px; min-width: 0; }
.cond > select { flex: 1; }
.cond .cmp { display: flex; gap: 2px; } .cond .cmp input { width: 62px; }
.scr-count { margin: 0; font-size: 12px; color: var(--ink-2); }
.scr-table { display: flex; flex-direction: column; }
.scr-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px 58px 58px; gap: 4px; align-items: center; padding: 5px 4px; border: 0; background: none; text-align: right; border-radius: 4px; font-size: 12px; }
.scr-row.head { position: sticky; top: -10px; background: var(--panel); padding: 4px; border-bottom: 1px solid var(--line); }
button.scr-row:hover, .scr-row.on { background: var(--bg); }
.scr-row .n { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.scr-row .n small { color: var(--ink-3); margin-left: 4px; font-size: 10px; }
.scr-h { border: 0; background: none; font-size: 11px; color: var(--ink-3); text-align: right; padding: 0; }
.scr-h:first-child { text-align: left; }
.alert-form { display: flex; flex-direction: column; gap: 6px; }
.alert-form p { margin: 0; }
.alert-form .row { display: flex; gap: 6px; }
.alert-form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--panel); }
.al-pick { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 6px; border: 0; background: none; text-align: left; font-size: 13px; }
.al-pick .st { grid-column: 1 / -1; font-size: 11px; color: var(--c4); }
.alerts li.hit .st { color: var(--ink-3); }
.info-name { margin: 0; font-size: 16px; } .info-name small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px; }
.kv dt { color: var(--ink-2); font-family: var(--font-ui); } .kv dd { margin: 0; text-align: right; }
.range .bar { position: relative; height: 4px; border-radius: 2px; background: var(--grid); margin: 6px 0 4px; }
.range .dot { position: absolute; top: -4px; width: 4px; height: 12px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.range .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; color: var(--ink-2); }

/* ── 모달·알림 토스트 ── */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 20, .35); display: grid; place-items: start center; padding: max(60px, env(safe-area-inset-top, 0px)) 12px 24px; overflow-y: auto; }
.modal { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25); display: flex; flex-direction: column; max-height: calc(100vh - 100px); }
.modal.wide { width: min(620px, 100%); }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal h3 { margin: 0; font-size: 15px; }
.modal .x { border: 0; background: none; font-size: 20px; color: var(--ink-2); width: 30px; height: 30px; border-radius: 4px; }
.modal .body { padding: 14px 16px; overflow-y: auto; min-height: 0; }
.modal .body p { margin: 0; line-height: 1.6; }
.modal footer { display: flex; justify-content: flex-end; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 7px 14px; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick { display: flex; flex-direction: column; gap: 10px; }
.dlg-search { width: 100%; box-sizing: border-box; height: 38px; border: 1px solid var(--line); border-radius: var(--r); padding: 0 12px; background: var(--bg); font-size: 14px; }
.sym-list { display: flex; flex-direction: column; max-height: 52vh; overflow-y: auto; }
.sym-list button { display: grid; grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr) 40px; gap: 8px; align-items: center; padding: 8px; border: 0; background: none; text-align: left; border-radius: 4px; }
.sym-list button[aria-selected="true"], .sym-list button:hover { background: var(--bg); }
.sl-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-t { font-size: 12px; color: var(--ink-2); } .sl-sec { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .sl-mk { font-size: 12px; color: var(--ink-3); text-align: right; }
.ind-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; }
.ind-list h4, .ind-cur h4, .form h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
.ind-cur { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; } .ind-cur h4 { width: 100%; }
.ind-item { display: flex; justify-content: space-between; width: 100%; padding: 7px 8px; border: 0; background: none; border-radius: 4px; text-align: left; }
.ind-item:hover { background: var(--bg); }
.ind-pane { font-size: 12px; color: var(--ink-3); }
.form { display: flex; flex-direction: column; gap: 8px; }
.form .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.form input[type="number"], .form input[type="text"] { width: 120px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--panel); }
.form input[type="text"] { width: 100%; box-sizing: border-box; }
.form input[type="color"] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 4px; padding: 2px; background: var(--panel); }
.toasts { position: fixed; z-index: 60; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--tag); color: var(--tag-ink); padding: 8px 14px; border-radius: var(--r); font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.foot { font-size: 11px; color: var(--ink-3); margin: 0; }

@media (max-width: 980px) {
  .main { grid-template-columns: 44px minmax(0, 1fr); }
  .side { grid-column: 1 / -1; height: 520px; }
}
@media (max-width: 640px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .drawbar { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 0 6px; }
  .db-sep { width: 1px; height: 20px; margin: 0 4px; }
  .grid { height: 480px; }
