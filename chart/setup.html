<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한투 키 연결</title>
<style>
/* 한 장짜리 설정 카드: 제목 → 입력 두 칸(길이 표시) → 실전/모의 → 연결 */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --line: #dfe3e8; --ink: #15191e; --ink-2: #59626d; --ink-3: #8a929c;
  --accent: #1f2a37; --accent-ink: #ffffff; --ok: #138a5e; --bad: #c8343b; --focus: #2a78d6;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1115; --panel: #151a20; --line: #2a313b; --ink: #e6eaef; --ink-2: #a3acb7; --ink-3: #6f7984;
    --accent: #e6eaef; --accent-ink: #11151a; --ok: #3fbf8a; --bad: #f07178; --focus: #5598e7; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); display: grid; place-items: start center; padding: 48px 16px; }
.card { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 21px; text-wrap: balance; }
p { margin: 0; color: var(--ink-2); }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
.field { position: relative; display: flex; }
input[type="password"], input[type="text"] { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 70px 0 12px; font: 14px var(--mono); background: var(--bg); color: var(--ink); }
input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.show { position: absolute; right: 6px; top: 7px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font: 13px var(--font); cursor: pointer; padding: 0 8px; }
.show:hover { color: var(--ink); background: var(--line); }
.len { font: 12px var(--mono); color: var(--ink-3); font-weight: 400; }
.len.ok { color: var(--ok); } .len.bad { color: var(--bad); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 18px; }
legend { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
fieldset label { flex-direction: row; align-items: center; gap: 6px; font-weight: 400; }
button.go { height: 46px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 600 15px var(--font); cursor: pointer; }
button.go:disabled { opacity: .5; cursor: wait; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.msg { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.msg.err { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
.msg.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.note { font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>한국투자증권 키 연결</h1>
  <p>KIS Developers에서 복사한 앱키와 앱시크릿을 아래 칸에 붙여넣으세요 (Ctrl+V). 처음 한 번만 하면 됩니다.</p>

  <label for="key">앱키 (App Key) <span class="len" id="keyLen">0자</span>
    <span class="field"><input type="password" id="key" spellcheck="false"><button type="button" class="show" data-for="key">보기</button></span>
  </label>
  <label for="secret">앱시크릿 (App Secret) <span class="len" id="secretLen">0자</span>
    <span class="field"><input type="password" id="secret" spellcheck="false"><button type="button" class="show" data-for="secret">보기</button></span>
  </label>

  <fieldset>
    <legend>계좌 종류</legend>
    <label><input type="radio" name="env" value="real" checked> 실전투자</label>
    <label><input type="radio" name="env" value="paper"> 모의투자</label>
  </fieldset>

  <div class="msg" id="msg" hidden></div>
  <button class="go" id="go" type="submit">연결하기</button>

  <p class="note">키는 이 PC의 프로그램 폴더 안 <code>.env</code> 파일에만 저장되고, 인터넷이나 GitHub에는 올라가지 않습니다. 이 화면은 이 PC 안에서만 열립니다.</p>
</form>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clean = s => s.replace(/[\s\u0000-\u001f]/g, "");
let need = { key: 36, secret: 180 };
function count() {
  for (const k of ["key", "secret"]) {
    const n = clean($(k).value).length, el = $(k + "Len");
    el.textContent = n ? `${n}자 ${n === need[k] ? "✓ 정상" : `(보통 ${need[k]}자)`}` : "0자";
    el.className = "len" + (n === need[k] ? " ok" : n ? " bad" : "");
  }
}
function show(text, ok) { const m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); m.hidden = false; }
document.querySelectorAll(".show").forEach(b => b.addEventListener("click", () => {
  const i = $(b.dataset.for); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "보기" : "숨기기";
}));
$("key").addEventListener("input", count); $("secret").addEventListener("input", count);
fetch("/api/status").then(r => r.json()).then(j => {
  if (j.live) { location.replace("/chart.html"); return; }
  if (j.key_len) need = { key: j.key_len, secret: j.secret_len };
  if (j.error) show(j.error, false);
}).catch(() => show("프로그램(검은 창)이 꺼져 있습니다. start_chart.bat 을 다시 실행해 주세요.", false));
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const key = clean($("key").value), secret = clean($("secret").value);
  if (!key || !secret) { show("앱키와 앱시크릿을 모두 넣어 주세요.", false); return; }
  if (key.length > secret.length) { show("앱키 칸이 앱시크릿 칸보다 깁니다. 두 칸을 바꿔 넣은 것 같습니다.", false); return; }
  $("go").disabled = true; $("go").textContent = "한투에 확인하는 중…";
  try {
    const r = await fetch("/api/setup", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ key, secret, env: document.querySelector('input[name="env"]:checked').value }) });
    const j = await r.json();
    if (j.ok) { show("연결됐습니다. 차트로 이동합니다…", true); setTimeout(() => location.replace("/chart.html"), 900); return; }
    show(j.error || "연결하지 못했습니다.", false);
  } catch { show("프로그램(검은 창)과 연결이 끊겼습니다. start_chart.bat 을 다시 실행해 주세요.", false); }
  $("go").disabled = false; $("go").textContent = "연결하기";
});
</script>
</body>
</html>
