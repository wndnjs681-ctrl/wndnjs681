name: market-index

# 시장 지수(나스닥·S&P500·코스피·코스닥)만 따로 받는다 — 1분 안팎. 필요할 때 수동 실행.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-full
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet requests finance-datareader pandas
      - name: Market index
        run: python market_index.py

      - name: Derivatives positioning (CFTC·VIX 곡선·풋콜)
        continue-on-error: true
        run: python derivs.py

      - name: Korean investor flow (수급)
        continue-on-error: true
        run: python kr_flow.py

      - name: Program trading by stock (한국투자증권 Open API)
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY || secrets.KIS_APPKEY || secrets.APP_KEY || secrets.APPKEY || secrets.KIS_KEY || secrets.KIS_API_KEY || secrets.KOREA_INVEST_APP_KEY || secrets.HANTU_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET || secrets.KIS_APPSECRET || secrets.APP_SECRET || secrets.APPSECRET || secrets.KIS_SECRET || secrets.KIS_API_SECRET || secrets.KOREA_INVEST_APP_SECRET || secrets.HANTU_APP_SECRET }}
        run: python kr_prog_kis.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/market_index.json output/derivs.json
          git diff --staged --quiet || git commit -m "market-index: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase --autostash || true
          git push
