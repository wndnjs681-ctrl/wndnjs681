name: market-index

# 시장 지수(나스닥·S&P500·코스피·코스닥)만 따로 받는다 — 1분 안팎. 필요할 때 수동 실행.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-full
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet requests finance-datareader pandas
      - name: Market index
        run: python market_index.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/market_index.json
          git diff --staged --quiet || git commit -m "market-index: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase --autostash || true
          git push
