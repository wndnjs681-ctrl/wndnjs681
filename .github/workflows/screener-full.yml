name: screener-full

on:
  schedule:
    # 국내 장 마감 후 — 매 평일 16:40 KST (07:40 UTC)
    - cron: "40 7 * * 1-5"
    # 미국 장 마감 후 — 매 화~토 06:10 KST (21:10 UTC 월~금). 미국만 돌려 빨리 끝낸다(07:00 동기화 전 완료)
    - cron: "10 21 * * 1-5"
  workflow_dispatch:
    inputs:
      markets:
        description: "수집할 시장 (kr, us, 또는 kr,us)"
        default: "kr,us"

permissions:
  contents: write

concurrency:
  group: screener-full
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet finance-datareader pandas numpy lxml requests beautifulsoup4

      - name: Run screener
        env:
          PYTHONUNBUFFERED: "1"
          KRX_FUND: "0"            # KRX 실적 화면은 액션 IP 에서 400 'LOGOUT' — 커밋된 컨센서스 파일로 계산
          MARKETS: ${{ github.event.inputs.markets || (github.event.schedule == '10 21 * * 1-5' && 'us' || 'kr,us') }}
          MIN_CAP_EOK: "500"
          MIN_VALUE_EOK: "3"
          MIN_CAP_MUSD: "1000"
          MAX_KR: "2600"
          MAX_US: "1200"
          WORKERS: "10"
          BB_LEN: "150"
          BB_K: "1.5"
        run: python screener_full.py

      - name: Market index (오닐 시장 방향)
        continue-on-error: true
        run: python market_index.py

      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          git diff --staged --quiet || git commit -m "screener-full: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase --autostash || true
          git push
