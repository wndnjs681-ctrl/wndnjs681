name: KR screener

on:
  schedule:
    # 평일 07:10 KST (= 전날 22:10 UTC). 깃허브 크론은 몇 분 밀릴 수 있어 여유를 둠.
    - cron: "10 22 * * 0-4"
  workflow_dispatch:        # 액션 탭에서 수동 실행용

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEAR_PCT: "15"        # 신고가 임박 허용폭 %
      OBV_WIN: "252"        # OBV 신고가 판정 구간(거래일)
      STREAK: "3"           # 연속 양봉 일수
      MIN_CAP_EOK: "1000"   # 최소 시가총액(억)
      MIN_VALUE_EOK: "10"   # 최소 거래대금(억)
      MAX_TICKERS: "900"    # 분석 상한(거래대금 상위)
      TOP_N: "20"           # 리포트에 실을 종목 수
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -U finance-datareader pandas numpy

      - name: Run screener
        run: python screener.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "screen: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
